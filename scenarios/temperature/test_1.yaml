name: 'Caso de Teste 1: Alarme por Porta Aberta (Tempo Limite X)'
version: 1
author: 'Professor/Validador'
steps:
  # 1. Aguarda o sistema inicializar completamente
  - wait-serial: 'Sistema de Monitoramento Inicializado'

  # 2. Garante o estado inicial estável: Porta Fechada (Botão solto = valor 0 no Wokwi)
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 1s

  # 3. Simula a abertura da porta (pressiona o botão para aterrar o pino = valor 1 no Wokwi)
  - set-control:
      part-id: btn1
      control: pressed
      value: 1

  # 4. Aguarda um tempo menor que X (ex: 3 segundos)
  - delay: 3s

  # 5. Aguarda completar o tempo X e verifica se o alarme dispara
  - wait-serial: 'ALERTA: Porta aberta por muito tempo!'
  
  - delay: 500ms